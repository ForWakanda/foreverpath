name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Syntax, mock play-through, regressions
        env:
          LUA: lua5.1
          LUAC: luac5.1
        run: bash tools/check.sh
